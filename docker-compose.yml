services:
  shaadisaathi:
    build:
      context: .
      dockerfile: Dockerfile
    image: shaadisaathi:latest
    container_name: shaadisaathi-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/data/shaadisaathi.db
      - UPLOADS_DIR=/data/uploads/documents
      # - ALLOWED_ORIGINS=https://wedding.myfamily.com
      # - GEMINI_API_KEY=your_gemini_api_key_here
    volumes:
      - wedding_data:/data

volumes:
  wedding_data:
    name: shaadisaathi_wedding_data
